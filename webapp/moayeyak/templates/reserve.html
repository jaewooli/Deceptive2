{% extends "base.html" %}
{% block title %}{{ store.name }} 예약 · 모아예약{% endblock %}
{% block content %}
<h1>{{ store.name }} 예약</h1>
<form method="post" class="form">
  <label>이름 <input name="customer_name" required maxlength="40"></label>
  <label>연락처 <input name="customer_phone" required maxlength="20" placeholder="010-0000-0000"></label>
  <label>날짜 <input type="date" name="date" required></label>
  <label>시간 <input type="time" name="time" required step="1800"></label>
  <label>인원 <input type="number" name="party_size" value="1" min="1" max="20"></label>
  <label>요청 사항 <textarea name="memo" maxlength="200"></textarea></label>
  <button class="btn" type="submit">예약하기</button>
</form>
{% endblock %}
