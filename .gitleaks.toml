# gitleaks 설정: 기본 규칙 + 미끼 템플릿 자리표시자 허용
# 실제 미끼 키(backup-legacy, T7)는 실제 IAM 사용자의 실제 키 → 절대 커밋 금지, 배포 시 주입
[extend]
useDefault = true

[allowlist]
description = "미끼 템플릿 자리표시자({{ ... }})와 AWS 문서 예시 키"
regexes = [
  '''\{\{\s*[A-Za-z0-9_.]+\s*\}\}''',
  '''AKIAIOSFODNN7EXAMPLE''',
  # CloudWatch 에이전트 패키지 서명 키의 공개 지문(AWS 문서 공개값, servers/base/install.sh)
  '''937616F3450B7D806CBD9725D58167303B789C72''',
]
