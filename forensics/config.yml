# 출발지 포렌식 설정(관리 쪽 — 서버엔 안 올라감). 바꾸면 시나리오 재실행(회귀)
follow_seconds: 300          # P의 활동을 이어서 기록하는 시간(벤더 "logs activities performed by P")
sink_url: http://127.0.0.1:9099/   # 포렌식 경보를 보낼 수신기(로컬). AWS는 11/29
# 감사(미끼 열람) 경보 중 수집하지 않을 것 — 정상 에이전트·검사의 주기적 읽기. 실행 파일 + 로그인 세션 없음(auid unset = cron·서비스가 띄움)이 둘 다 맞을 때만
#   (공격자가 로그인 세션에서 같은 프로그램을 돌리면 auid가 있어 수집함). 경보 억제 자체는 11/30 오탐 분석에서
audit_skip:
  - {exe: ^/snap/amazon-ssm-agent/, auid: unset}            # 11/23 실측: 키 파일을 약 30초마다
  - {exe: ^/opt/aws/amazon-cloudwatch-agent/, auid: unset}
  - {exe: ^/usr/bin/clamscan$, auid: unset}                 # 매일 03:17 전체 검사 cron — 미끼 파일 내용을 연다(plan-wbs 4절 예상 오탐원, 실측은 기준선 때)
print_acts: 5                # 콘솔에 사건마다 보여 줄 활동 수(전부는 collect.jsonl)
recover_lookback: 10          # 연결이 이미 끝났을 때 감사 기록을 거슬러 볼 여유(경보 받은 뒤 지난 시간 + 이 값)
tarpit_ms: 2000              # 팜 투영 연결 수립 지연(SYN+ACK만). 11/24: 경보→수집기 0.7초, 실패한 ssh 0.28초 → 2초면 연결 중에 도착
