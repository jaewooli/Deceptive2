# 환경 프로필 — 로컬 랩(docs/local-aws-parity.md). 로컬과 AWS의 차이는 이 파일과 aws.yml에만 둔다(코드에 환경 분기 금지).
# 이 값들로 out/baits/{inventory,destinations}.yml 과 검사 명세를 만든다: python3 infra/env/render.py local
name: local

# 회사 LAN(VPC 10.0.0.0/16에 해당). 로컬은 관리 NIC가 10.0.2.0/24라 /23으로 좁힌다
lan_cidr: 10.0.20.0/23
segments:                      # 구간 = 서브넷. 게이트웨이 = .1(로컬 router VM, AWS는 VPC 라우터)
  10.0.20.0/24: {name: internal, gw: 10.0.20.1, sensor_nics: [enp0s3]}
  10.0.21.0/24: {name: public, gw: 10.0.21.1, sensor_nics: [enp0s8]}

# 관리 접속(미끼 엔진·검사). 로컬 = lab.sh VM의 SSH 포워딩, 팜 = WSL2 자신(local)
access:
  user: ubuntu
  key: ~/.cache/deceptive2-vm/id_ed25519
  # 검사 실행기(infra/checks/paths.py)의 접속: 표준입력의 셸 스크립트를 root로. {host} {root} {key}
  run: "{root}/infra/local-vm/lab.sh ssh {host} 'sudo sh -s'"
  run_local: "sudo sh -s"                       # 팜 = WSL2 자신
  # 투영 디코이 안쪽: 회사 서버(web-01)를 점프 호스트로(관리 키는 호스트에만, 디코이 auth.log에 web-01 출발 로그인이 남음 — 측정 흔적)
  #   점프는 ProxyCommand로 — -J는 점프 호스트에 -o 옵션이 안 먹어 사용자의 ~/.ssh/known_hosts와 부딪힘(11/23, 사용자 파일은 건드리지 않음)
  run_decoy: "ssh -i {key} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ProxyCommand='ssh -i {key} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 2235 -W %h:%p ubuntu@127.0.0.1' ubuntu@{host} 'sudo sh -s'"
hosts:
  web-01: {group: company, port: 2235}
  app-01: {group: company, port: 2232}
  db-backup-01: {group: decoys, port: 2231, ip: 10.0.20.15}
  sensor: {group: sensors, port: 2233}
  router: {group: lab, port: 2236}           # 로컬 전용(VPC 라우터 흉내)
  farm: {group: farms, connection: local}    # WSL2 = 팜(3중 중첩 회피, 11/23)

farm:
  # 센서·EDH가 터널을 거는 팜 주소 — VM에서 본 WSL2(QEMU 사용자망). AWS는 팜 서브넷 주소
  tunnel_endpoint: 10.0.2.2
  # 부팅 때 자동 시작 안 함 — WSL2는 사용자 작업 환경, `wsl --shutdown`이 항상 완전 복구(docs/local-farm-recovery.md)
  persist: false
  guest:
    cpus: 2                    # 랩 VM과 같은 2(WSL2 위 1단 KVM이라 3중 중첩 문제 없음)
    disk_gb: 20                # 로컬 진짜 VM 디스크(vda 20G). AWS는 8
    # 디코이 출발 이미지 = 이웃(진짜 서버)과 같은 serial — 로컬은 랩 VM이 쓴 바로 그 파일(11/23: 팜이 새로 받은 이미지는 serial이 달랐음)
    base_image: ~/.cache/deceptive2-vm/noble-server-cloudimg-amd64.img
    # 로컬 랩 VM에만 손으로 둔 파일(infra/loadtest/README.md: CloudWatch 에이전트 onPremise용 AWS 문서 예시 키) — 디코이도 같게.
    # 값은 저장소에 두지 않고 빌드 때 진짜 서버에서 그대로 복사(권한·소유자·시각 유지). 없으면 공통 베이스의 fetch-config가 실패(11/23)
    mirror_from: app-01
    mirror_files: [/root/.aws/credentials, /root/.aws/config]
    hw: local                  # 기계 모양: local = 랩 VM(q35·virtio·nocloud), aws = EC2처럼(미구현 — local-aws-parity 4절)
    cwagent_mode: onPremise
    dns: 10.0.2.3              # 디코이 안 DNS = 진짜 랩 VM과 같은 값(QEMU 사용자망 DNS)
    apt_proxy: http://10.0.2.2:3142   # 디코이 안 01-lab-proxy = 진짜 랩 VM과 같은 파일
    # 빌드 동안만: 디코이가 본 주소 → WSL2 쪽 실제 주소(진짜 VM은 QEMU 사용자망이 해 주는 일)
    build_redirect:
      - {to: 10.0.2.2, port: 3142, proto: tcp, via: "127.0.0.1:3142"}   # apt 캐시(lab.sh가 127.0.0.1에 띄움)
      - {to: 10.0.2.3, port: 53, proto: udp, via: resolver}             # resolver = 실행 때 /etc/resolv.conf에서
      - {to: 10.0.2.3, port: 53, proto: tcp, via: resolver}
