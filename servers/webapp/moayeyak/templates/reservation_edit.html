{% extends "base.html" %}
{% block title %}예약 변경 · 모아예약{% endblock %}
{% block content %}
<h1>예약 변경</h1>
<p>예약 번호 <strong>{{ r.code }}</strong> · {{ r.store.name }}</p>
<form method="post" class="form">
  <label>날짜 <input type="date" name="date" required value="{{ r.reserved_at.strftime('%Y-%m-%d') }}"></label>
  <label>시간 <input type="time" name="time" required step="1800" value="{{ r.reserved_at.strftime('%H:%M') }}"></label>
  <label>인원 <input type="number" name="party_size" min="1" max="20" value="{{ r.party_size }}"></label>
  <label>요청 사항 <textarea name="memo" maxlength="200">{{ r.memo }}</textarea></label>
  <label>예약 번호 <input type="text" name="code" required value="{{ r.code }}"></label>
  <button class="btn" type="submit">변경 저장</button>
</form>
{% endblock %}
